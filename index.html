<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIA 타이거즈 2079시즌 예상 라인업</title>
  <style>
    :root {
      --kia-red: #ea0029;
      --kia-navy: #06141f;
      --bg: #091018;
      --panel: rgba(9, 20, 31, 0.88);
      --panel-2: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.1);
      --text-main: #f5f7fa;
      --text-sub: #b8c2cc;
      --text-dim: #7f8a96;
      --white: #ffffff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(234, 0, 41, 0.18), transparent 30%),
        linear-gradient(180deg, #0d1722 0%, #081018 100%);
      min-height: 100vh;
      padding: 32px 20px 48px;
    }

    .dashboard-container {
      max-width: 1480px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      gap: 32px;
      align-items: center;
      padding: 28px 30px;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(234, 0, 41, 0.14), rgba(6, 20, 31, 0.96) 40%, rgba(6, 20, 31, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: sheen 7s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes sheen {
      to { transform: translateX(100%); }
    }

    .hero > * { position: relative; z-index: 1; }

    .logo-wrap {
      width: 180px;
      height: 180px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.25));
    }
    
    .hero-text {
      text-align: center;
    }

    .hero-text h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .hero-text h1 .accent {
      color: var(--kia-red);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(12, 22, 34, 0.95) 0%, rgba(8, 16, 24, 0.96) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .panel-title {
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--white);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title .mark {
      color: var(--kia-red);
    }

    .list-group { margin-bottom: 18px; }

    .list-title {
      color: #ffbcc7;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .player-item:hover {
      transform: translateY(-2px);
      border-color: rgba(234, 0, 41, 0.42);
      background: linear-gradient(180deg, rgba(234,0,41,0.12), rgba(255,255,255,0.03));
    }

    .player-pos {
      flex: 0 0 auto;
      min-width: 38px;
      font-size: 0.76rem;
      font-weight: 900;
      color: var(--kia-red);
      background: rgba(234, 0, 41, 0.1);
      border: 1px solid rgba(234, 0, 41, 0.22);
      border-radius: 999px;
      text-align: center;
      padding: 5px 8px;
    }

    .player-name {
      flex: 1;
      text-align: right;
      font-size: 0.96rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .sub-pos {
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-left: 6px;
      font-weight: 600;
    }

    .new-badge {
      display: inline-block;
      background: #ffcc00;
      color: #000;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: middle;
      line-height: 1;
    }

    .field-panel {
      background:
        linear-gradient(180deg, rgba(10, 18, 28, 0.98) 0%, rgba(6, 20, 31, 0.98) 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .field-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(234,0,41,0.12), rgba(255,255,255,0.02));
    }

    .field-header h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 900;
    }

    .field-wrapper {
      position: relative;
      height: 760px;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 112%, #6d4a28 0 12%, #228b4d 12.5%, #166f3f 65%, #115230 100%);
      overflow: hidden;
    }

    .field-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, transparent 0 9.7%, rgba(255,255,255,0.03) 10%, transparent 10.3%),
        linear-gradient(to bottom, transparent 0 9.7%, rgba(255,255,255,0.03) 10%, transparent 10.3%);
      background-size: 72px 72px;
      opacity: 0.28;
      pointer-events: none;
    }

    .outfield-arc {
      position: absolute;
      left: 50%;
      bottom: -36%;
      width: 86%;
      height: 94%;
      transform: translateX(-50%);
      border: 5px solid rgba(255,255,255,0.72);
      border-bottom: none;
      border-radius: 50% 50% 0 0;
      opacity: 0.9;
      box-shadow: 0 0 0 12px rgba(6,20,31,0.14) inset;
    }

    .foul-line {
      position: absolute;
      bottom: 18%;
      width: 4px;
      height: 58%;
      background: rgba(255,255,255,0.72);
      transform-origin: bottom center;
      border-radius: 6px;
      z-index: 1;
    }

    .foul-left {
      left: calc(50% - 2px);
      transform: rotate(45deg);
    }

    .foul-right {
      left: calc(50% - 2px);
      transform: rotate(-45deg);
    }

    .infield-diamond {
      position: absolute;
      bottom: 14%;
      left: 50%;
      width: 290px;
      height: 290px;
      transform: translateX(-50%) rotate(45deg);
      border: 4px solid rgba(255,255,255,0.76);
      background: linear-gradient(180deg, rgba(126, 84, 42, 0.92), rgba(101, 66, 32, 0.98));
      border-radius: 12px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.18);
      z-index: 1;
    }

    .mound {
      position: absolute;
      left: 50%;
      bottom: 31.5%;
      width: 70px;
      height: 70px;
      transform: translateX(-50%);
      background: rgba(126, 84, 42, 0.95);
      border: 3px solid rgba(255,255,255,0.58);
      border-radius: 50%;
      z-index: 2;
    }

    .home-plate {
      position: absolute;
      left: 50%;
      bottom: 8.6%;
      width: 82px;
      height: 82px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(255,255,255,0.9);
      clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%);
      z-index: 2;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .pos-box {
      position: absolute;
      width: 124px;
      padding: 10px;
      background: rgba(6, 20, 31, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 3px solid var(--kia-red);
      border-radius: 16px;
      z-index: 3;
      box-shadow: 0 10px 22px rgba(0,0,0,0.36);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .pos-box h3 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: #ffd3dc;
      font-weight: 900;
      letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 6px;
    }

    .depth-player {
      font-size: 0.84rem;
      margin-bottom: 5px;
      line-height: 1.25;
      font-weight: 700;
    }

    .depth-player:first-child {
      color: var(--white);
    }

    .depth-player:not(:first-child) {
      color: var(--text-sub);
      font-weight: 600;
    }

    .p-box-c { bottom: 3%; left: 50%; transform: translateX(-50%); }
    .p-box-1B { bottom: 36%; right: 7.5%; }
    .p-box-2B { bottom: 51%; right: 27%; }
    .p-box-3B { bottom: 36%; left: 7.5%; }
    .p-box-SS { bottom: 51%; left: 27%; }
    .p-box-LF { top: 18%; left: 6%; }
    .p-box-CF { top: 5%; left: 50%; transform: translateX(-50%); }
    .p-box-RF { top: 18%; right: 6%; }

    .footer-note {
      margin-top: 18px;
      color: var(--text-dim);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 1200px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }

      .field-wrapper {
        height: 700px;
      }
    }

    @media (max-width: 760px) {
      body { padding: 18px 14px 32px; }

      .hero {
        flex-direction: column;
        text-align: center;
        padding: 22px 18px;
      }

      .logo-wrap {
        margin: 0 auto;
        width: 140px;
        height: 140px;
      }

      .field-wrapper {
        height: 640px;
        padding: 16px;
      }

      .infield-diamond {
        width: 220px;
        height: 220px;
      }

      .pos-box {
        width: 96px;
        padding: 8px;
      }

      .depth-player {
        font-size: 0.76rem;
      }

      .p-box-1B { right: 3%; }
      .p-box-3B { left: 3%; }
      .p-box-2B { right: 20%; }
      .p-box-SS { left: 20%; }
      .p-box-LF { left: 3%; }
      .p-box-RF { right: 3%; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <section class="hero">
      <div class="logo-wrap">
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA8sAAALUCAYAAAA8BqBVAAAQAElEQVR4AeydBZwV1RfHf7PdTYiilCKhINKSAgLSId0hXQKCKCogiIgooWCiqDTSEiIIiqBgYPu3O+ju3f89A4vL8t7ue7sz783M+/GZw9S9557zvfPevjO3gsB/JEACphJIS0tbooQbCZAACZAACZAACRhJ4AlTf8BQOQmQABwYLLNWSYAESIAESIAESIAESIAESCB3BBgs546fb3KzFBIgARIgARIgARIgARIgARIgAZ8SYLDsU9wsLJ0A9yRAAiRAAiRAAiRAAiRAAiRgZQIMlq1cO7TNTgRoKwmQAAmQAAmQAAmQAAmQgIMIMFh2UGXSFRIwlgC1kQAJkAAJkAAJkAAJkEDgEmCwHLh1T89JIPAI0GMSIAESIAESIAESIAES8JAAg2UPQTEZCZAACViRAG0iARIgARIgARIgARIwhwCDZXO4UisJkAAJkEDOCDAXCZAACZAACZAACViCAINlS1QDjSABEiABEnAuAXpGAiRAAiRAAiRgRwIMlu1Ya7SZBEiABEiABPxJgGWTAAmQAAmQQAAQYLAcAJVMF0mABEiABEiABLImwLskQAIkQAIkkJkAg+XMRHhOAiRAAiRAAiRAAvYnQA9IgARIgARySYDBci4BMjsJkAAJkAAJkAAJkIAvCLAMEiABEvAtAQbLvuXN0kiABEiABEiABEiABEjgAgH+TwIkYGkCDJYtXT00jgRIgARIgARIgARIgATsQ4CWkoCTCDBYdlJt0hcSIAESIAESIAESIAESIAEjCVBXABNgsBzAlU/XSYAESIAESIAESIAESIAEAo0A/fWUAINlT0kxHQmQAAmQAAmQAAmQAAmQAAmQgPUImGQRg2WTwFItCZhB4Njx45gw5UkKGfAZ4DPAZ4DPAZ4DPAZsNkzwGDZmb/N6JWzCTBYNrR+qYwESIAESIAESIAESIAESIAESMAJBBgsO6EWzfSBukmABEiABEiABEiABEiABEggAAkwWA7ASg90l+k/CZAACZAACZAACZAACZAACWRHgMFydoR4nwSsT4AWkgAJkAAJkAAJkAAJkAAJGEyAwbLBQKmOBEjACALUQQIkQAIkQAIkQAIkQAL+JcBg2b/8WToJkECgEKCfJEACJEACJEACJEACtiLAYNlW1UVjSYAESMA6BGgJCZAACZAACZAACTiZAINlJ9cufSMBEiABEvCGANOSAAmQAAmQAAmQwCUCDJYvoeABCZAACZAACTiNAP0hARIgARIgARLIKQEGyzklx3wkQAIkQAIkQAK+J8ASSYAESIAESMBHBBgs+wg0iyEBEiABEiABEiABVwR4jQRIgARIwJoEGCxbs15oFQmQAAmQAAmQAAnYlQDtJgESIAFHEGCw7IhqpBMkQAIkQAIkQAIkQALmEaBmEiCBQCTAYDkQa50+
      </div>
      <div class="hero-text">
        <h1><span class="accent">KIA 타이거즈</span> 2079시즌 예상 라인업</h1>
      </div>
    </section>

    <div class="grid-layout">
      <aside class="panel">
        <h2 class="panel-title"><span>⚾ 투수진</span><span class="mark">Pitching Staff</span></h2>
        <div id="pitching-staff"></div>
      </aside>

      <section class="field-panel">
        <div class="field-header">
          <h2>🧤 수비 뎁스 차트</h2>
        </div>
        <div class="field-wrapper">
          <div class="outfield-arc"></div>
          <div class="foul-line foul-left"></div>
          <div class="foul-line foul-right"></div>
          <div class="infield-diamond"></div>
          <div class="mound"></div>
          <div class="home-plate"></div>

          <div id="pos-C" class="pos-box p-box-c"><h3>C</h3><div class="players"></div></div>
          <div id="pos-1B" class="pos-box p-box-1B"><h3>1B</h3><div class="players"></div></div>
          <div id="pos-2B" class="pos-box p-box-2B"><h3>2B</h3><div class="players"></div></div>
          <div id="pos-3B" class="pos-box p-box-3B"><h3>3B</h3><div class="players"></div></div>
          <div id="pos-SS" class="pos-box p-box-SS"><h3>SS</h3><div class="players"></div></div>
          <div id="pos-LF" class="pos-box p-box-LF"><h3>LF</h3><div class="players"></div></div>
          <div id="pos-CF" class="pos-box p-box-CF"><h3>CF</h3><div class="players"></div></div>
          <div id="pos-RF" class="pos-box p-box-RF"><h3>RF</h3><div class="players"></div></div>
        </div>
      </section>

      <aside class="panel">
        <h2 class="panel-title"><span>📋 스타팅 라인업</span><span class="mark">Batting Order</span></h2>
        <div id="starting-lineup"></div>

        <h2 class="panel-title" style="margin-top: 24px;"><span>🪑 기타</span><span class="mark">DH / Bench</span></h2>
        <div id="dh-bench"></div>
      </aside>
    </div>

    <div class="footer-note">KIA TIGERS 2079 SEASON PREVIEW DASHBOARD</div>
  </div>

  <script>
    const data = {
      pitchers: [
        { role: "SP (선발)", names: ["이시연", "레제", "용병", "용병"] },
        { role: "LR (롱릴리프)", names: ["배찬승", "김진성"] },
        { role: "MR (미들릴리프)", names: ["타마마", "이승호", "용병", "용병"] },
        { role: "SU (셋업)", names: ["김광현"] },
        { role: "CL (마무리)", names: ["이도훈"] }
      ],
      fieldDepth: {
        "C": ["양의지", "박영환"],
        "1B": ["오레오"],
        "2B": ["홍현우"],
        "3B": ["아카네"],
        "SS": ["구준", "전민재"],
        "LF": ["전의산", "이명기"],
        "CF": ["임선우", "마린"],
        "RF": ["용병"]
      },
      dhBench: [
        { role: "DH (지명타자)", names: ["바이퍼"] }
      ],
      lineup: [
        { order: 1, name: "홍현우", pos: "2B" },
        { order: 2, name: "아카네", pos: "3B" },
        { order: 3, name: "임선우", pos: "CF" },
        { order: 4, name: "오레오", pos: "1B" },
        { order: 5, name: "전의산", pos: "LF" },
        { order: 6, name: "용병", pos: "RF" },
        { order: 7, name: "구준", pos: "SS" },
        { order: 8, name: "양의지", pos: "C" },
        { order: 9, name: "바이퍼", pos: "DH" }
      ]
    };

    // 신규 영입 선수 목록 (이번에는 홍현우를 추가하고 기존 아카네를 유지했습니다)
    const newSignings = ["홍현우", "아카네"];

    const pitchingContainer = document.getElementById('pitching-staff');
    data.pitchers.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'list-group';

      const title = document.createElement('div');
      title.className = 'list-title';
      title.textContent = group.role;
      groupEl.appendChild(title);

      group.names.forEach(name => {
        const item = document.createElement('div');
        item.className = 'player-item';
        const newTag = newSignings.includes(name) ? '<span class="new-badge">NEW</span>' : '';
        
        item.innerHTML = `
          <span class="player-pos">P</span>
          <span class="player-name">${newTag}${name}</span>
        `;
        groupEl.appendChild(item);
      });

      pitchingContainer.appendChild(groupEl);
    });

    Object.keys(data.fieldDepth).forEach(pos => {
      const box = document.querySelector(`#pos-${pos} .players`);
      if (!box) return;
      box.innerHTML = data.fieldDepth[pos]
        .map(name => {
          const newTag = newSignings.includes(name) ? '<span class="new-badge">NEW</span>' : '';
          return `<div class="depth-player">${newTag}${name}</div>`;
        })
        .join('');
    });

    const lineupContainer = document.getElementById('starting-lineup');
    lineupContainer.innerHTML = data.lineup.map(player => {
      const newTag = newSignings.includes(player.name) ? '<span class="new-badge">NEW</span>' : '';
      return `
      <div class="player-item">
        <span class="player-pos">${player.order}번</span>
        <span class="player-name">${newTag}${player.name}<span class="sub-pos">(${player.pos})</span></span>
      </div>
    `}).join('');

    const dhContainer = document.getElementById('dh-bench');
    data.dhBench.forEach(group => {
      const groupEl = document.createElement('div');
      groupEl.className = 'list-group';

      const title = document.createElement('div');
      title.className = 'list-title';
      title.textContent = group.role;
      groupEl.appendChild(title);

      group.names.forEach(name => {
        const item = document.createElement('div');
        item.className = 'player-item';
        const newTag = newSignings.includes(name) ? '<span class="new-badge">NEW</span>' : '';
        
        item.innerHTML = `<span class="player-name" style="text-align:left;">${newTag}${name}</span>`;
        groupEl.appendChild(item);
      });

      dhContainer.appendChild(groupEl);
    });
  </script>
</body>
</html>
