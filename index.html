<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIA 타이거즈 2080시즌 예상 라인업</title>
  <style>
    :root {
      --kia-red: #ea0029;
      --kia-navy: #06141f;
      --bg: #091018;
      --panel: rgba(9, 20, 31, 0.88);
      --panel-2: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.1);
      --text-main: #f5f7fa;
      --text-sub: #b8c2cc;
      --text-dim: #7f8a96;
      --white: #ffffff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, rgba(234, 0, 41, 0.18), transparent 30%),
        linear-gradient(180deg, #0d1722 0%, #081018 100%);
      min-height: 100vh;
      padding: 32px 20px 48px;
    }

    .dashboard-container {
      max-width: 1480px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      align-items: center;
      padding: 28px 30px;
      border-radius: 30px;
      background:
        linear-gradient(135deg, rgba(234, 0, 41, 0.14), rgba(6, 20, 31, 0.96) 40%, rgba(6, 20, 31, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: sheen 7s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes sheen {
      to { transform: translateX(100%); }
    }

    .hero > * { position: relative; z-index: 1; }

    .logo-wrap {
      width: 180px;
      height: 180px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.03);
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.25));
    }
    
    .hero-text {
      text-align: center;
    }

    .hero-text h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .hero-text h1 .accent {
      color: var(--kia-red);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 320px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, rgba(12, 22, 34, 0.95) 0%, rgba(8, 16, 24, 0.96) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .panel-title {
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: var(--white);
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title .mark {
      color: var(--kia-red);
    }

    .list-group { margin-bottom: 18px; }

    .list-title {
      color: #ffbcc7;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .player-item:hover {
      transform: translateY(-2px);
      border-color: rgba(234, 0, 41, 0.42);
      background: linear-gradient(180deg, rgba(234,0,41,0.12), rgba(255,255,255,0.03));
    }

    .player-pos {
      flex: 0 0 auto;
      min-width: 38px;
      font-size: 0.76rem;
      font-weight: 900;
      color: var(--kia-red);
      background: rgba(234, 0, 41, 0.1);
      border: 1px solid rgba(234, 0, 41, 0.22);
      border-radius: 999px;
      text-align: center;
      padding: 5px 8px;
    }

    .player-name {
      flex: 1;
      text-align: right;
      font-size: 0.96rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .sub-pos {
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-left: 6px;
      font-weight: 600;
    }

    .new-badge,
    .resigned-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: middle;
      line-height: 1;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .new-badge {
      background: #ffcc00;
      color: #000;
    }

    .resigned-badge {
      background: #4dd4ff;
      color: #00111a;
    }

    .editable-row {
      align-items: stretch;
    }

    .editable-row.is-editing .entry-view,
    .editable-row:not(.is-editing) .entry-editor {
      display: none;
    }

    .entry-view {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .entry-editor {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 78px 108px;
      gap: 6px;
      align-items: center;
    }

    .entry-editor.name-only {
      grid-template-columns: minmax(0, 1fr) 108px;
    }

    .panel .entry-editor,
    .panel .entry-editor.name-only {
      grid-template-columns: 1fr;
    }

    .editor-input,
    .editor-select,
    .edit-button {
      width: 100%;
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      outline: none;
      padding: 8px 9px;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .editor-input::placeholder {
      color: var(--text-dim);
      font-weight: 600;
    }

    .editor-input:focus,
    .editor-select:focus,
    .edit-button:focus {
      border-color: rgba(234, 0, 41, 0.66);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px rgba(234, 0, 41, 0.13);
    }

    .editor-select {
      appearance: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    .editor-select.is-new {
      border-color: rgba(255, 204, 0, 0.65);
      color: #ffcc00;
    }

    .editor-select.is-resigned {
      border-color: rgba(77, 212, 255, 0.65);
      color: #4dd4ff;
    }

    .edit-button {
      flex: 0 0 auto;
      width: auto;
      color: var(--text-dim);
      font-size: 0.72rem;
      padding: 6px 8px;
      cursor: pointer;
    }

    .edit-button:hover {
      color: var(--white);
      border-color: rgba(234, 0, 41, 0.42);
    }

    .empty-slot {
      color: var(--text-dim);
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.25;
    }

    .field-panel {
      background:
        linear-gradient(180deg, rgba(10, 18, 28, 0.98) 0%, rgba(6, 20, 31, 0.98) 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .field-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(234,0,41,0.12), rgba(255,255,255,0.02));
    }

    .field-header h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 900;
    }

    .field-wrapper {
      position: relative;
      height: 760px;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 112%, #6d4a28 0 12%, #228b4d 12.5%, #166f3f 65%, #115230 100%);
      overflow: hidden;
    }

    .field-wrapper::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, transparent 0 9.7%, rgba(255,255,255,0.03) 10%, transparent 10.3%),
        linear-gradient(to bottom, transparent 0 9.7%, rgba(255,255,255,0.03) 10%, transparent 10.3%);
      background-size: 72px 72px;
      opacity: 0.28;
      pointer-events: none;
    }

    .outfield-arc {
      position: absolute;
      left: 50%;
      bottom: -36%;
      width: 86%;
      height: 94%;
      transform: translateX(-50%);
      border: 5px solid rgba(255,255,255,0.72);
      border-bottom: none;
      border-radius: 50% 50% 0 0;
      opacity: 0.9;
      box-shadow: 0 0 0 12px rgba(6,20,31,0.14) inset;
    }

    .foul-line {
      position: absolute;
      bottom: 18%;
      width: 4px;
      height: 58%;
      background: rgba(255,255,255,0.72);
      transform-origin: bottom center;
      border-radius: 6px;
      z-index: 1;
    }

    .foul-left {
      left: calc(50% - 2px);
      transform: rotate(45deg);
    }

    .foul-right {
      left: calc(50% - 2px);
      transform: rotate(-45deg);
    }

    .infield-diamond {
      position: absolute;
      bottom: 14%;
      left: 50%;
      width: 290px;
      height: 290px;
      transform: translateX(-50%) rotate(45deg);
      border: 4px solid rgba(255,255,255,0.76);
      background: linear-gradient(180deg, rgba(126, 84, 42, 0.92), rgba(101, 66, 32, 0.98));
      border-radius: 12px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.18);
      z-index: 1;
    }

    .mound {
      position: absolute;
      left: 50%;
      bottom: 31.5%;
      width: 70px;
      height: 70px;
      transform: translateX(-50%);
      background: rgba(126, 84, 42, 0.95);
      border: 3px solid rgba(255,255,255,0.58);
      border-radius: 50%;
      z-index: 2;
    }

    .home-plate {
      position: absolute;
      left: 50%;
      bottom: 8.6%;
      width: 82px;
      height: 82px;
      transform: translateX(-50%) rotate(45deg);
      background: rgba(255,255,255,0.9);
      clip-path: polygon(0 0, 100% 0, 100% 58%, 50% 100%, 0 58%);
      z-index: 2;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .pos-box {
      position: absolute;
      width: 148px;
      padding: 10px;
      background: rgba(6, 20, 31, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 3px solid var(--kia-red);
      border-radius: 16px;
      z-index: 3;
      box-shadow: 0 10px 22px rgba(0,0,0,0.36);
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .pos-box h3 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      color: #ffd3dc;
      font-weight: 900;
      letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 6px;
    }

    .depth-player {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 0;
      font-size: 0.84rem;
      margin-bottom: 5px;
      line-height: 1.25;
      font-weight: 700;
      white-space: nowrap;
    }

    .depth-player .new-badge,
    .depth-player .resigned-badge {
      margin-right: 2px;
      font-size: 0.52rem;
      padding: 2px 4px;
    }

    .depth-player:first-child {
      color: var(--white);
    }

    .depth-player:not(:first-child) {
      color: var(--text-sub);
      font-weight: 600;
    }

    .p-box-c { bottom: 3%; left: 50%; transform: translateX(-50%); }
    .p-box-1B { bottom: 36%; right: 7.5%; }
    .p-box-2B { bottom: 51%; right: 27%; }
    .p-box-3B { bottom: 36%; left: 7.5%; }
    .p-box-SS { bottom: 51%; left: 27%; }
    .p-box-LF { top: 18%; left: 6%; }
    .p-box-CF { top: 5%; left: 50%; transform: translateX(-50%); }
    .p-box-RF { top: 18%; right: 6%; }

    .footer-note {
      margin-top: 18px;
      color: var(--text-dim);
      font-size: 0.82rem;
      text-align: right;
    }

    @media (max-width: 1200px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }

      .field-wrapper {
        height: 700px;
      }
    }

    @media (max-width: 760px) {
      body { padding: 18px 14px 32px; }

      .hero {
        flex-direction: column;
        text-align: center;
        padding: 22px 18px;
      }

      .logo-wrap {
        margin: 0 auto;
        width: 140px;
        height: 140px;
      }

      .field-wrapper {
        height: 640px;
        padding: 16px;
      }

      .infield-diamond {
        width: 220px;
        height: 220px;
      }

      .pos-box {
        width: 132px;
        padding: 8px;
      }

      .entry-editor,
      .entry-editor.name-only {
        grid-template-columns: 1fr;
      }

      .depth-player {
        font-size: 0.72rem;
      }

      .depth-player .new-badge,
      .depth-player .resigned-badge {
        font-size: 0.48rem;
        padding: 2px 3px;
      }

      .p-box-1B { right: 3%; }
      .p-box-3B { left: 3%; }
      .p-box-2B { right: 20%; }
      .p-box-SS { left: 20%; }
      .p-box-LF { left: 3%; }
      .p-box-RF { right: 3%; }
    }
  </style>
</head>

  <script>
    const STORAGE_KEY = 'kia-tigers-2080-lineup-editor';
    const FIELD_POSITIONS = ['C', '1B', '2B', '3B', 'SS', 'LF', 'CF', 'RF'];
    const POSITION_ALIASES = {
      '포수': 'C',
      '1루': '1B',
      '1루수': '1B',
      '2루': '2B',
      '2루수': '2B',
      '3루': '3B',
      '3루수': '3B',
      '유격수': 'SS',
      '좌익수': 'LF',
      '중견수': 'CF',
      '우익수': 'RF',
      '지명타자': 'DH'
    };

    const data = {
      pitchers: [
        { role: "SP (선발)", count: 4, label: "P", placeholder: "선발" },
        { role: "LR (롱릴리프)", count: 2, label: "P", placeholder: "롱릴리프" },
        { role: "MR (미들릴리프)", count: 4, label: "P", placeholder: "미들릴리프" },
        { role: "SU (셋업)", count: 1, label: "P", placeholder: "셋업" },
        { role: "CL (마무리)", count: 1, label: "P", placeholder: "마무리" }
      ],
      lineupCount: 9,
      benchCount: 5
    };

    const statusOptions = [
      { value: '', label: '상태 없음' },
      { value: 'new', label: 'NEW' },
      { value: 'resigned', label: 'RE-SIGNED' }
    ];

    const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const rows = [];

    const saveValue = (key, value) => {
      savedState[key] = value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
    };

    const normalizePosition = value => {
      const trimmed = value.trim();
      const upper = trimmed.toUpperCase();
      return POSITION_ALIASES[trimmed] || upper;
    };

    const createInput = (key, placeholder, onChange) => {
      const input = document.createElement('input');
      input.className = 'editor-input';
      input.type = 'text';
      input.placeholder = placeholder;
      input.autocomplete = 'off';
      input.value = savedState[key] || '';
      input.addEventListener('input', event => {
        saveValue(key, event.target.value);
        onChange?.();
      });
      return input;
    };

    const updateStatusSelectClass = select => {
      select.classList.toggle('is-new', select.value === 'new');
      select.classList.toggle('is-resigned', select.value === 'resigned');
    };

    const createStatusSelect = (key, onChange) => {
      const select = document.createElement('select');
      select.className = 'editor-select';
      select.setAttribute('aria-label', '선수 상태');

      statusOptions.forEach(option => {
        const optionEl = document.createElement('option');
        optionEl.value = option.value;
        optionEl.textContent = option.label;
        select.appendChild(optionEl);
      });

      select.value = savedState[key] || '';
      updateStatusSelectClass(select);
      select.addEventListener('change', event => {
        saveValue(key, event.target.value);
        updateStatusSelectClass(select);
        onChange?.();
      });
      return select;
    };

    const createStatusBadge = status => {
      if (!status) return null;

      const badge = document.createElement('span');
      badge.className = status === 'new' ? 'new-badge' : 'resigned-badge';
      badge.textContent = status === 'new' ? 'NEW' : 'RE-SIGNED';
      return badge;
    };

    const getRowValues = keys => ({
      name: (savedState[keys.name] || '').trim(),
      position: keys.position ? (savedState[keys.position] || '').trim() : '',
      status: savedState[keys.status] || ''
    });

    const fillPlayerName = (container, values) => {
      container.textContent = '';
      const badge = createStatusBadge(values.status);
      if (badge) container.appendChild(badge);
      container.append(values.name);
      if (values.position) {
        const pos = document.createElement('span');
        pos.className = 'sub-pos';
        pos.textContent = `(${values.position})`;
        container.appendChild(pos);
      }
    };

    const refreshRow = row => {
      const values = getRowValues(row.keys);
      const isComplete = values.name && (!row.keys.position || values.position);
      row.item.classList.toggle('is-editing', row.isEditing || !isComplete);
      if (!isComplete) return;
      fillPlayerName(row.nameEl, values);
    };

    const refreshAllRows = () => rows.forEach(refreshRow);

    const getLineupValues = () => rows
      .filter(row => row.type === 'lineup')
      .map(row => ({ ...getRowValues(row.keys), order: row.order }))
      .filter(player => player.name && player.position);

    const refreshFieldFromLineup = () => {
      const lineup = getLineupValues();

      FIELD_POSITIONS.forEach(pos => {
        const box = document.querySelector(`#pos-${pos} .players`);
        if (!box) return;
        box.textContent = '';

        const players = lineup.filter(player => normalizePosition(player.position) === pos);
        if (!players.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-slot';
          empty.textContent = '라인업 입력 대기';
          box.appendChild(empty);
          return;
        }

        players.forEach(player => {
          const item = document.createElement('div');
          item.className = 'depth-player';
          const badge = createStatusBadge(player.status);
          if (badge) item.appendChild(badge);
          item.append(player.name);
          box.appendChild(item);
        });
      });
    };

    const refreshDhFromLineup = () => {
      const dhContainer = document.getElementById('dh-auto');
      if (!dhContainer) return;
      dhContainer.textContent = '';

      const dhPlayers = getLineupValues().filter(player => normalizePosition(player.position) === 'DH');
      if (!dhPlayers.length) {
        const empty = document.createElement('div');
        empty.className = 'player-item';
        const message = document.createElement('span');
        message.className = 'player-name';
        message.style.textAlign = 'left';
        message.style.color = 'var(--text-dim)';
        message.textContent = '타선에서 포지션을 DH로 입력하면 자동 반영됩니다';
        empty.appendChild(message);
        dhContainer.appendChild(empty);
        return;
      }

      dhPlayers.forEach(player => {
        const item = document.createElement('div');
        item.className = 'player-item';

        const label = document.createElement('span');
        label.className = 'player-pos';
        label.textContent = 'DH';
        item.appendChild(label);

        const name = document.createElement('span');
        name.className = 'player-name';
        fillPlayerName(name, player);
        item.appendChild(name);
        dhContainer.appendChild(item);
      });
    };

    const refreshLineupLinkedViews = () => {
      refreshFieldFromLineup();
      refreshDhFromLineup();
    };

    const createEditableRow = ({ type, label, order, keys, namePlaceholder, positionPlaceholder, onChange }) => {
      const item = document.createElement('div');
      item.className = 'player-item editable-row';

      const labelEl = document.createElement('span');
      labelEl.className = 'player-pos';
      labelEl.textContent = label;
      item.appendChild(labelEl);

      const view = document.createElement('div');
      view.className = 'entry-view';

      const nameEl = document.createElement('span');
      nameEl.className = 'player-name';
      view.appendChild(nameEl);

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.className = 'edit-button';
      editButton.textContent = '수정';
      view.appendChild(editButton);
      item.appendChild(view);

      const editor = document.createElement('div');
      editor.className = `entry-editor${keys.position ? '' : ' name-only'}`;
      const rowChange = () => {
        refreshRow(row);
        onChange?.();
      };
      editor.appendChild(createInput(keys.name, namePlaceholder, rowChange));
      if (keys.position) {
        editor.appendChild(createInput(keys.position, positionPlaceholder, rowChange));
      }
      editor.appendChild(createStatusSelect(keys.status, rowChange));
      item.appendChild(editor);

      const row = { type, order, keys, item, nameEl, isEditing: false };
      editor.addEventListener('focusin', () => {
        row.isEditing = true;
        refreshRow(row);
      });
      editButton.addEventListener('click', () => {
        row.isEditing = true;
        refreshRow(row);
        editor.querySelector('input')?.focus();
      });
      editor.addEventListener('focusout', () => {
        window.setTimeout(() => {
          if (!editor.contains(document.activeElement)) {
            row.isEditing = false;
            refreshRow(row);
          }
        }, 0);
      });

      rows.push(row);
      refreshRow(row);
      return item;
    };

    const pitchingContainer = document.getElementById('pitching-staff');
    data.pitchers.forEach((group, groupIndex) => {
      const groupEl = document.createElement('div');
      groupEl.className = 'list-group';

      const title = document.createElement('div');
      title.className = 'list-title';
      title.textContent = group.role;
      groupEl.appendChild(title);

      Array.from({ length: group.count }).forEach((_, slotIndex) => {
        const slotNo = slotIndex + 1;
        groupEl.appendChild(createEditableRow({
          type: 'pitcher',
          label: group.label,
          keys: {
            name: `pitcher-${groupIndex}-${slotIndex}-name`,
            status: `pitcher-${groupIndex}-${slotIndex}-status`
          },
          namePlaceholder: `${group.placeholder} ${slotNo}`
        }));
      });

      pitchingContainer.appendChild(groupEl);
    });

    const lineupContainer = document.getElementById('starting-lineup');
    Array.from({ length: data.lineupCount }).forEach((_, slotIndex) => {
      const order = slotIndex + 1;
      lineupContainer.appendChild(createEditableRow({
        type: 'lineup',
        order,
        label: `${order}번`,
        keys: {
          name: `lineup-${slotIndex}-name`,
          position: `lineup-${slotIndex}-position`,
          status: `lineup-${slotIndex}-status`
        },
        namePlaceholder: '선수 이름',
        positionPlaceholder: '포지션',
        onChange: refreshLineupLinkedViews
      }));
    });

    const dhContainer = document.getElementById('dh-bench');

    const dhGroup = document.createElement('div');
    dhGroup.className = 'list-group';
    const dhTitle = document.createElement('div');
    dhTitle.className = 'list-title';
    dhTitle.textContent = 'DH (지명타자)';
    dhGroup.appendChild(dhTitle);
    const dhAuto = document.createElement('div');
    dhAuto.id = 'dh-auto';
    dhGroup.appendChild(dhAuto);
    dhContainer.appendChild(dhGroup);

    const benchGroup = document.createElement('div');
    benchGroup.className = 'list-group';
    const benchTitle = document.createElement('div');
    benchTitle.className = 'list-title';
    benchTitle.textContent = 'Bench (벤치)';
    benchGroup.appendChild(benchTitle);

    Array.from({ length: data.benchCount }).forEach((_, slotIndex) => {
      const slotNo = slotIndex + 1;
      benchGroup.appendChild(createEditableRow({
        type: 'bench',
        label: 'B',
        keys: {
          name: `bench-${slotIndex}-name`,
          position: `bench-${slotIndex}-position`,
          status: `bench-${slotIndex}-status`
        },
        namePlaceholder: `벤치 ${slotNo}`,
        positionPlaceholder: '포지션'
      }));
    });
    dhContainer.appendChild(benchGroup);

    refreshAllRows();
    refreshLineupLinkedViews();
  </script>
</body>
</html>
